# ============================================================
# Configuração do projeto CVM ETL
# ============================================================
# Só o que as ferramentas leem.
# Dependências ficam nos requirements*.txt.
# ============================================================

# ------------------------------------------------------------
# Ruff — linter + formatador
# ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = [
    ".venv",
    "__pycache__",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ------------------------------------------------------------
# Pytest — testes
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
    "slow: testes que demoram mais de 1 segundo",
    "integration: testes que precisam de banco/API",
]


[tool.uv]
package = false